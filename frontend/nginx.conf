# The console's static files, and the API behind the same origin.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        # "api" is the API's service name in docker-compose.yml.
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Read by the API only because this proxy is named in ReverseProxy:KnownProxies; it is
        # what gives each client its own rate-limit bucket instead of one for the proxy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # The console routes in the URL fragment, so every path is the one page.
        try_files $uri /index.html;
    }
}
