# The console's static files, and the API behind the same origin.
#
# Where there is no nginx the API serves these files itself and sends the same headers, from
# Nelsar.Axia.Api/Middleware/SecurityHeadersMiddleware.cs. A change to one belongs in the other.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Everything the console loads comes from here: its script and stylesheet are files Vite
    # emits (no inline script, no inline <style>, no data: URL), its fonts are bundled, and the
    # API is this origin's /api/. So nothing else is allowed — above all no script from anywhere
    # else, which is what turns a markup injection into a stolen session: the token is in
    # localStorage, where any script on the page can read it. connect-src 'self' also means this
    # build talks to no API but its own, whatever address the browser has stored.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Ignored by browsers over plain HTTP, as the quick start serves it; in effect once a proxy in
    # front terminates TLS. No includeSubDomains: other hosts under the same name are not ours.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        # "api" is the API's service name in docker-compose.yml.
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Read by the API only because this proxy is named in ReverseProxy:KnownProxies; it is
        # what gives each client its own rate-limit bucket instead of one for the proxy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # The console routes in the URL fragment, so every path is the one page.
        try_files $uri /index.html;
    }
}
