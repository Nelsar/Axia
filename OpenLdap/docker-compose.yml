#version: '3.8'

services:
  openldap:
    image: osixia/openldap:latest
    container_name: openldap
    environment:
      - LDAP_ORGANISATION=Nelsar
      - LDAP_DOMAIN=nelsar.com
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=password@
      # TLS for the container's own listener on 636. The API does not use it — it speaks plain
      # LDAP on 389; see SECURITY.md under known limitations.
      - LDAP_TLS=true
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      # Applied on first start only, against an empty ldap_data volume: OU people/groups, ~2000
      # test users, and two groups (Administrators/UserCreators). The fixtures themselves are not
      # in the repository — see README.md under "Not in scope yet".
      - ./bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "389:389"
      - "636:636"
    restart: always

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=openldap
      - PHPLDAPADMIN_HTTPS=false
    ports:
      - "8081:80"
    depends_on:
      - openldap
    restart: always

volumes:
  ldap_data:
  ldap_config: