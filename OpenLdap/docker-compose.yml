#version: '3.8'

services:
  openldap:
    image: osixia/openldap:latest
    container_name: openldap
    environment:
      - LDAP_ORGANISATION=Nelsar
      - LDAP_DOMAIN=nelsar.com
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=password@
      # Настройка TLS (по умолчанию включена)
      - LDAP_TLS=true
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      # Применяется только при первом старте (на пустом ldap_data volume):
      # OU people/groups, ~2000 тестовых пользователей, 2 группы (Administrators/UserCreators).
      - ./bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "389:389"
      - "636:636"
    restart: always

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=openldap
      - PHPLDAPADMIN_HTTPS=false
    ports:
      - "8081:80"
    depends_on:
      - openldap
    restart: always

volumes:
  ldap_data:
  ldap_config: