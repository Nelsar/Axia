# Every step here is one a contributor can run locally; see CONTRIBUTING.md for the commands.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Nothing in this workflow writes to the repository, and a workflow that
# cannot write is a workflow a malicious pull request cannot turn into one that does.
permissions:
  contents: read

# A new push to the same branch makes the previous run's answer stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  api:
    name: API — build and test
    runs-on: ubuntu-latest
    # For PostgreSqlTests, the only tests that need a server; each makes a database of its own on
    # it. Locally they are skipped unless AXIA_TEST_POSTGRES is set — see PostgreSqlFactAttribute.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AXIA_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=ci-only;Database=postgres
      # Missing server, failed tests: never a job that skips them and passes.
      AXIA_TEST_POSTGRES_REQUIRED: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Nelsar.Axia.sln

      # -warnaserror, and the build is warning-free today. The alternative is a warning count
      # that only ever grows, with the real one arriving among the others: the three CA1416 this
      # repo carried for a while were saying that a Windows-only provider was being constructed
      # on Linux, which is exactly the kind of thing that gets read as noise.
      - run: dotnet build Nelsar.Axia.sln --no-restore -warnaserror

      # No directory and no network: the suite stands up the API in memory, on SQLite or EF Core's
      # in-memory store, apart from the PostgreSQL tests above. Anything that starts needing a
      # live LDAP server belongs behind a trait, not in this job.
      - run: dotnet test Nelsar.Axia.sln --no-build --verbosity normal

  console:
    name: Console — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `npm run build` is `tsc --noEmit && vite build`. The typecheck is the half that matters
      # most here: the message dictionaries are typed so that a missing translation in any
      # language fails to compile, and that check exists nowhere else.
      - run: npm run build

  quickstart:
    name: Quick start — compose up and sign in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The README's first command, with --build so that it runs this commit rather than the
      # released images it would pull. It catches what no other job builds: both Dockerfiles,
      # the nginx proxy, the generated certificate, keys and database password, the API starting
      # on PostgreSQL and seeding it, the demo directory and the role mappings in
      # docker-compose.yml.
      - run: docker compose up -d --build

      # Readiness is polled on the unauthenticated picker rather than on sign-in: sign-in is
      # rate-limited to five attempts a minute, and polling it would spend them.
      - name: Sign in as admin.demo through the console's proxy
        run: |
          for attempt in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:8080/api/v1/providers/selectable && break
            sleep 5
          done
          for attempt in $(seq 1 12); do
            if curl -fsS -X POST http://localhost:8080/api/v1/auth/login \
                 -H 'Content-Type: application/json' \
                 -d '{"email":"admin.demo","password":"Axia-Demo-1"}' | grep -q '"role":"Admin"'; then
              echo "admin.demo signed in as Admin."
              exit 0
            fi
            sleep 10
          done
          docker compose ps -a
          docker compose logs
          exit 1

      - if: always()
        run: docker compose down -v

  dependencies:
    name: Dependencies — known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `dotnet list package --vulnerable` exits 0 whatever it finds, so the output is what is
      # checked. Two patterns rather than one because a false negative here is silent: if the
      # phrasing changes in a future SDK, the advisory URLs still give it away.
      - name: NuGet
        run: |
          dotnet restore Nelsar.Axia.sln
          dotnet list package --vulnerable --include-transitive | tee nuget-audit.txt
          if grep -qE "has the following vulnerable|github.com/advisories" nuget-audit.txt; then
            echo "::error::Vulnerable NuGet packages — see the table above."
            exit 1
          fi

      # Moderate and below are reported without failing: the console's dependency tree is small
      # and dev-only tooling dominates it, so a moderate advisory in a build-time package should
      # not block an unrelated pull request. It still shows in the log.
      - name: npm
        working-directory: frontend
        run: |
          npm ci
          npm audit || true
          npm audit --audit-level=high
