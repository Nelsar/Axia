# Dependabot opens the pull requests; CI's `dependencies` job is what fails when a known
# vulnerability is already in the tree. The two answer different questions — "is there a newer
# version" and "is what we ship affected" — and neither replaces the other.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for the test stack: xunit, Moq and the runners move together and a
      # version skew between them fails in ways that are tedious to read one package at a time.
      test-stack:
        patterns: ["xunit*", "Moq*", "Microsoft.NET.Test.Sdk", "coverlet*"]
    ignore:
      # MediatR is Apache-2.0 up to 12.x. From 13.0 it is dual-licensed — RPL-1.5, or commercial
      # with a licence key — so the bump Dependabot would offer is a licence change dressed as a
      # version number, for every deployment of this project. Moving off 12.x is a decision to
      # make on purpose (another mediator, or none), not a weekly pull request.
      #
      # Ignored by update type rather than by range: Dependabot read the NuGet interval "[13.0,)"
      # as an ill-formed requirement and failed the whole NuGet run on it, so nothing here was
      # updated at all. Minor and patch releases of 12.x still come through.
      - dependency-name: "MediatR"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Proposed one at a time, each of these failed `npm ci` on a peer dependency: @types/react 19
      # beside @types/react-dom 18, Vite 8 beside a plugin that supports Vite 7 at most. They are
      # one upgrade each, and come as one pull request.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*"]

  # Actions are pinned to major tags here, so these updates are the ones that matter: a tag moves
  # under you silently, and a major bump does not.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
