# Quick start: the API, the console, PostgreSQL and an OpenLDAP with demo accounts, wired together
# the way a real deployment should be — LDAPS to the directory with a verified certificate, a
# reverse proxy in front of the API, generated keys and passwords, nothing published beyond the
# console on localhost.
#
#   docker compose up
#
# Then open http://localhost:8080 and sign in as admin.demo / Axia-Demo-1. See README.md, "Quick
# start", for the other accounts and what each one may do.
#
# The API and the console are the released images from ghcr.io, of the version below, for amd64
# and arm64 alike. `docker compose up --build` builds them from this checkout instead, which is
# what to run after changing the code — and what happens on its own when the version named is not
# published.
#
# This is for trying the project out, not for production: the directory, its demo passwords and
# the database live in local Docker volumes. `docker compose down -v` removes all of it.

name: nelsar-axia

services:
  # Generates the directory's certificate, the API's keys and the database's password on the first
  # start; see the script.
  init:
    # The directory's image, already needed below, for the openssl it carries.
    image: osixia/openldap:1.5.0
    entrypoint: ["sh", "/init.sh"]
    volumes:
      - ./deploy/quickstart/init.sh:/init.sh:ro
      - ldap-certs:/ldap-certs
      - api-secrets:/api-secrets
      - db-secrets:/db-secrets

  # Where the API keeps what is not in the directory: directories it connects to, role mappings
  # and permissions, rate limits, the audit trail. Reachable only on this network.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nelsar_axia
      POSTGRES_USER: nelsar_axia
      POSTGRES_PASSWORD_FILE: /secrets/postgres-password
    volumes:
      - db-secrets:/secrets:ro
      - db-data:/var/lib/postgresql/data
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nelsar_axia -d nelsar_axia"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  openldap:
    image: osixia/openldap:1.5.0
    # --copy-service: the image rewrites its asset folders while it starts, and the certificates
    # and demo data below are mounted read-only.
    command: ["--copy-service"]
    # The name the API connects to, and the name in the directory's certificate.
    hostname: openldap
    environment:
      LDAP_ORGANISATION: Nelsar.Axia quick start
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-quickstart-admin}
      LDAP_TLS_CRT_FILENAME: ldap.crt
      LDAP_TLS_KEY_FILENAME: ldap.key
      LDAP_TLS_CA_CRT_FILENAME: ca.crt
      LDAP_TLS_VERIFY_CLIENT: never
    volumes:
      - ldap-certs:/container/service/slapd/assets/certs:ro
      - ./deploy/quickstart/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-demo.ldif:ro
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      # Ready once the demo data is in, which is after the image's own first-start setup.
      test: ["CMD-SHELL", "ldapwhoami -x -H ldap://localhost -D uid=admin.demo,ou=people,dc=example,dc=org -w Axia-Demo-1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  api:
    # The version is set at each release, with the others — or ahead of it, by a change that the
    # published images cannot run, as moving to PostgreSQL was; see "Releasing" in CONTRIBUTING.md.
    image: ghcr.io/nelsar/axia-api:${AXIA_VERSION:-0.3.0}
    build:
      context: .
      dockerfile: Dockerfile
    # The keys and the database's connection string come from the file init wrote, read into the
    # environment just before the API starts, so they never appear in this file, in
    # `docker inspect` or in an image layer. Arguments are passed on, which is what
    # `docker compose run --rm api copy-database …` needs.
    entrypoint: ["sh", "-c", "set -a && . /secrets/api.env && set +a && exec dotnet Nelsar.Axia.Api.dll \"$$@\"", "api"]
    environment:
      Database__Provider: PostgreSql

      # The directory: LDAPS on 636 (both defaults), with the quick start's own CA trusted.
      Ldap__Server: openldap
      Ldap__TrustedCaCertificatePath: /secrets/ca.crt
      Ldap__BaseDn: dc=example,dc=org
      Ldap__AdminUsername: cn=admin,dc=example,dc=org
      Ldap__AdminPassword: ${LDAP_ADMIN_PASSWORD:-quickstart-admin}

      # Which directory groups are which roles, by DN, and which group's members only an Admin
      # may change.
      RoleMappings__GroupDns__Admin: cn=axia-admins,ou=groups,dc=example,dc=org
      RoleMappings__GroupDns__UserCreator: cn=axia-creators,ou=groups,dc=example,dc=org
      RoleMappings__GroupDns__UserEditor: cn=axia-editors,ou=groups,dc=example,dc=org
      DirectoryProtection__ProtectedGroups__0: cn=axia-admins,ou=groups,dc=example,dc=org

      # The console's nginx is the only way in. Naming it is what lets the API believe its
      # X-Forwarded-For, so each browser gets its own sign-in rate limit rather than sharing one.
      ReverseProxy__KnownProxies__0: 172.31.250.10

      # Logs to stdout only: `docker compose logs api`.
      Observability__File__Enabled: "false"
      Observability__Console__Json: "false"
    volumes:
      - api-secrets:/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      openldap:
        condition: service_healthy
    restart: unless-stopped

  console:
    image: ghcr.io/nelsar/axia-console:${AXIA_VERSION:-0.3.0}
    build:
      context: ./frontend
    ports:
      # Localhost only: the demo passwords are in this repository.
      - "127.0.0.1:${CONSOLE_PORT:-8080}:8080"
    networks:
      default:
        ipv4_address: 172.31.250.10
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # Fixed so the console's address above can be named as the API's trusted proxy.
        - subnet: 172.31.250.0/24

volumes:
  ldap-certs:
  api-secrets:
  db-secrets:
  ldap-data:
  ldap-config:
  db-data:
